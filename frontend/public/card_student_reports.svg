<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlowRep" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a081a"/>
      <stop offset="50%" stop-color="#12030d"/>
      <stop offset="100%" stop-color="#050104"/>
    </radialGradient>

    <!-- Glass Gradients -->
    <linearGradient id="glassCardRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="glassCardEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="borderRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="barGradEmerald" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlowRose" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowEmerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGlowRep)"/>

  <!-- Cyber Grid -->
  <g opacity="0.15" stroke="#f43f5e" stroke-width="1">
    <path d="M0 400 L800 400 M0 360 L800 360 M0 330 L800 330 M0 310 L800 310"/>
    <path d="M400 300 L100 450 M400 300 L250 450 M400 300 L400 450 M400 300 L550 450 M400 300 L700 450"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="200" r="170" fill="#e11d48" opacity="0.3" filter="url(#neonGlowRose)"/>
  <circle cx="580" cy="220" r="150" fill="#10b981" opacity="0.25" filter="url(#neonGlowEmerald)"/>

  <!-- ==================== MAIN ATTENDANCE MATRIX BOARD (LEFT) ==================== -->
  <g transform="translate(70, 70)">
    <!-- 3D Shadow -->
    <rect x="12" y="15" width="370" height="280" rx="24" fill="#000000" opacity="0.6"/>
    <!-- Glass Panel -->
    <rect x="0" y="0" width="370" height="280" rx="24" fill="url(#glassCardRose)" stroke="url(#borderRose)" stroke-width="2" filter="url(#neonGlowRose)"/>
    
    <!-- Top Header -->
    <rect x="20" y="20" width="135" height="24" rx="12" fill="#f43f5e" fill-opacity="0.3"/>
    <text x="87" y="36" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">ATTENDANCE MATRIX</text>
    
    <!-- Matrix Rows -->
    <g transform="translate(20, 65)">
      <!-- Header Row -->
      <text x="5" y="14" fill="#fda4af" font-family="monospace" font-size="10" font-weight="800">STUDENT</text>
      <text x="170" y="14" fill="#fda4af" font-family="monospace" font-size="10" font-weight="800">W1</text>
      <text x="210" y="14" fill="#fda4af" font-family="monospace" font-size="10" font-weight="800">W2</text>
      <text x="250" y="14" fill="#fda4af" font-family="monospace" font-size="10" font-weight="800">W3</text>
      <text x="290" y="14" fill="#fda4af" font-family="monospace" font-size="10" font-weight="800">W4</text>

      <!-- Row 1 -->
      <g transform="translate(0, 26)">
        <rect x="0" y="0" width="330" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
        <text x="10" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Kasun Perera</text>
        <circle cx="178" cy="15" r="7" fill="#10b981" filter="url(#neonGlowEmerald)"/><text x="178" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">✓</text>
        <circle cx="218" cy="15" r="7" fill="#10b981" filter="url(#neonGlowEmerald)"/><text x="218" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">✓</text>
        <circle cx="258" cy="15" r="7" fill="#10b981" filter="url(#neonGlowEmerald)"/><text x="258" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">✓</text>
        <circle cx="298" cy="15" r="7" fill="#10b981" filter="url(#neonGlowEmerald)"/><text x="298" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">✓</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 64)">
        <rect x="0" y="0" width="330" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
        <text x="10" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Sanduni Maleesha</text>
        <circle cx="178" cy="15" r="7" fill="#10b981" filter="url(#neonGlowEmerald)"/><text x="178" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">✓</text>
        <circle cx="218" cy="15" r="7" fill="#10b981" filter="url(#neonGlowEmerald)"/><text x="218" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">✓</text>
        <circle cx="258" cy="15" r="7" fill="#ef4444"/><text x="258" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">×</text>
        <circle cx="298" cy="15" r="7" fill="#10b981" filter="url(#neonGlowEmerald)"/><text x="298" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">✓</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 102)">
        <rect x="0" y="0" width="330" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
        <text x="10" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Dinadi Ayansa</text>
        <circle cx="178" cy="15" r="7" fill="#10b981" filter="url(#neonGlowEmerald)"/><text x="178" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">✓</text>
        <circle cx="218" cy="15" r="7" fill="#10b981" filter="url(#neonGlowEmerald)"/><text x="218" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">✓</text>
        <circle cx="258" cy="15" r="7" fill="#10b981" filter="url(#neonGlowEmerald)"/><text x="258" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">✓</text>
        <circle cx="298" cy="15" r="7" fill="#10b981" filter="url(#neonGlowEmerald)"/><text x="298" y="18.5" fill="#fff" font-size="9" font-weight="900" text-anchor="middle">✓</text>
      </g>

      <!-- Summary Bar -->
      <g transform="translate(0, 148)">
        <text x="5" y="14" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11" font-weight="800">AVG ATTENDANCE:</text>
        <text x="145" y="14" fill="#34d399" font-family="monospace" font-size="13" font-weight="900" filter="url(#neonGlowEmerald)">96.4%</text>
      </g>
    </g>
  </g>

  <!-- ==================== RADIAL ANALYTICS GAUGE CARD (RIGHT) ==================== -->
  <g transform="translate(480, 70)">
    <!-- 3D Shadow -->
    <rect x="12" y="15" width="250" height="280" rx="24" fill="#000000" opacity="0.6"/>
    <!-- Glass Panel -->
    <rect x="0" y="0" width="250" height="280" rx="24" fill="url(#glassCardEmerald)" stroke="#34d399" stroke-width="2" filter="url(#neonGlowEmerald)"/>
    
    <!-- Top Header -->
    <rect x="20" y="20" width="110" height="24" rx="12" fill="#10b981" fill-opacity="0.3"/>
    <text x="75" y="36" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">ANALYTICS</text>
    
    <!-- Radial Ring Progress -->
    <circle cx="125" cy="130" r="55" fill="none" stroke="#064e3b" stroke-width="12"/>
    <circle cx="125" cy="130" r="55" fill="none" stroke="#34d399" stroke-width="12" stroke-dasharray="345" stroke-dashoffset="60" stroke-linecap="round" filter="url(#neonGlowEmerald)"/>
    
    <!-- Center Metric -->
    <text x="125" y="126" fill="#ffffff" font-family="monospace" font-size="28" font-weight="900" text-anchor="middle">94%</text>
    <text x="125" y="146" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">ACTIVE RATIO</text>
    
    <!-- Bottom Total -->
    <text x="125" y="222" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900" text-anchor="middle">4,850+</text>
    <text x="125" y="242" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Total Registered</text>
  </g>

  <!-- Glowing Sparks -->
  <circle cx="100" cy="90" r="3" fill="#fda4af" filter="url(#neonGlowRose)"/>
  <circle cx="700" cy="100" r="3" fill="#6ee7b7" filter="url(#neonGlowEmerald)"/>
  <circle cx="440" cy="380" r="3" fill="#fb7185" filter="url(#neonGlowRose)"/>
</svg>
